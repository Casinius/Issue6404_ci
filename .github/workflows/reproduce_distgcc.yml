name: DistGcc

on:
  push:
  workflow_dispatch:

env:
  XPACK_VERSION: "15.2.0-1"
  XPACK_URL: "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz"

jobs:
  reproduce:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 安装系统依赖
      # ============================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autotools-dev curl python3 python3-pip \
            libmpc-dev libmpfr-dev libgmp-dev gawk build-essential \
            bison flex texinfo gperf libtool patchutils bc \
            zlib1g-dev libexpat-dev ninja-build git

      # ============================================================
      # 2. 安装 xmake v2.9.9
      # ============================================================
      - name: Install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash -s -- v2.9.9
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify xmake
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          xmake --version

      # ============================================================
      # 3. 下载并安装 xPack RISC-V GCC（预编译）
      # ============================================================
      - name: Install xPack RISC-V GCC
        run: |
          curl -fsSL -o xpack-riscv.tar.gz "$XPACK_URL"
          mkdir -p "$HOME/xpack"
          tar -xzf xpack-riscv.tar.gz -C "$HOME/xpack" --strip-components=1
          echo "$HOME/xpack/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          export PATH="$HOME/xpack/bin:$PATH"
          riscv-none-elf-gcc --version
          which riscv-none-elf-gcc

      # ============================================================
      # 4. 克隆测试项目
      # ============================================================
      - name: Clone test project
        run: |
          git clone https://github.com/Stehsaer/simple-riscv-software-env.git
          cd simple-riscv-software-env
          git checkout a3ae04298f8dfcc0f6e0a8f2681511be2bea0558

      # ============================================================
      # 5. 修改 toolchain.lua（对调代码块以触发 bug）
      # ============================================================
      - name: Modify toolchain.lua
        run: |
          cd simple-riscv-software-env
          git clone https://github.com/Casinius/Issue6404_ci.git
          python3 ./Issue6404_ci/replace.py

      # ============================================================
      # 5.1 验证修改后的 toolchain.lua（可选）
      # ============================================================
      - name: Show modified toolchain.lua
        run: |
          cd simple-riscv-software-env
          echo "=== Modified toolchain.lua (first 50 lines) ==="
          head -50 toolchain.lua

      # ============================================================
      # 6. 配置项目 (使用 xmake f)
      # ============================================================
      - name: Configure with xmake
        run: |
          cd simple-riscv-software-env
          export PATH="$HOME/.local/bin:$PATH"
          export PATH="$HOME/xpack/bin:$PATH"
          # 配置信息会直接输出到终端，方便查看
          export XMAKE_LOGFILE="cf_build.log"
          export XMAKE_COLORTERM="nocolor"  # 可选，但推荐
          xmake f -c -a rv32im_zicond_zicsr_zifencei --mode=releasedbg || true
          cat cf_build.log
          exit 1

      # ============================================================
      # 7. 第一次构建 (不带 -r，应包含 -march)
      # ============================================================
      - name: First build (without -r)
        run: |
          cd simple-riscv-software-env
          export PATH="$HOME/.local/bin:$PATH"
          export PATH="$HOME/xpack/bin:$PATH"
          # 设置日志文件路径，并禁用颜色输出以保证日志为纯文本
          export XMAKE_LOGFILE="first_build.log"
          export XMAKE_COLORTERM="nocolor"  # 可选，但推荐
          xmake build -vD project.kintex7-bootloader || true
          echo "=== First build log saved to first_build.log ==="
          # 构建失败时打印日志内容以便调试
          cat first_build.log
          exit 1
          echo "=== First build succeeded ==="

      # ============================================================
      # 8. 第二次构建 (带 -r，应缺失 -march)
      # ============================================================
      - name: Second build (with -r)
        run: |
          cd simple-riscv-software-env
          export PATH="$HOME/.local/bin:$PATH"
          export PATH="$HOME/xpack/bin:$PATH"
          # 设置不同的日志文件名
          export XMAKE_LOGFILE="second_build.log"
          export XMAKE_COLORTERM="nocolor"
          xmake build -vDr project.kintex7-bootloader || true
          echo "=== Second build log saved to second_build.log ==="
          cat second_build.log
          exit 1
          echo "=== Second build succeeded ==="
      # ============================================================
      # 9. 验证 flags 是否在第二次构建中丢失
      # ============================================================
      - name: Verify flags
        run: |
          cd simple-riscv-software-env
          echo "=== Checking -march flag ==="
          if grep -q "\-march=rv32im" first_build.log; then
            echo "✅ First build contains -march flag"
          else
            echo "❌ First build does NOT contain -march flag"
            exit 1
          fi
          if grep -q "\-march=rv32im" second_build.log; then
            echo "⚠️  Second build still contains -march (not reproduced)"
            exit 1
          else
            echo "✅ Second build does NOT contain -march (issue reproduced)"
          fi

      # ============================================================
      # 10. 上传日志
      # ============================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: simple-riscv-software-env/*.log