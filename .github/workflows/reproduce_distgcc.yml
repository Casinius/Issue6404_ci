name: DistGcc

on:
  push:
  workflow_dispatch:

env:
  XPACK_VERSION: "15.2.0-1"
  XPACK_URL: "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz"

jobs:
  reproduce:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 安装系统依赖
      # ============================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autotools-dev curl python3 python3-pip \
            libmpc-dev libmpfr-dev libgmp-dev gawk build-essential \
            bison flex texinfo gperf libtool patchutils bc \
            zlib1g-dev libexpat-dev ninja-build git

      # ============================================================
      # 2. 安装 xmake v2.9.9
      # ============================================================
      - name: Install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash -s -- v2.9.9
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify xmake
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          xmake --version

      # ============================================================
      # 3. 下载并安装 xPack RISC-V GCC
      # ============================================================
      - name: Install xPack RISC-V GCC
        run: |
          curl -fsSL -o xpack-riscv.tar.gz "$XPACK_URL"
          mkdir -p "$HOME/xpack"
          tar -xzf xpack-riscv.tar.gz -C "$HOME/xpack" --strip-components=1
          echo "$HOME/xpack/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          export PATH="$HOME/xpack/bin:$PATH"
          riscv-none-elf-gcc --version
          which riscv-none-elf-gcc

      # ============================================================
      # 4. 克隆测试项目
      # ============================================================
      - name: Clone test project
        run: |
          git clone https://github.com/Stehsaer/simple-riscv-software-env.git
          cd simple-riscv-software-env
          git checkout a3ae04298f8dfcc0f6e0a8f2681511be2bea0558
          ls -la

      # ============================================================
      # 5. 修改 toolchain.lua 触发 bug
      # ============================================================
      - name: Modify toolchain.lua
        run: |
          cd simple-riscv-software-env
          git clone https://github.com/Casinius/Issue6404_ci.git
          python3 ./Issue6404_ci/replace.py

      # ============================================================
      # 6. 第一次构建（应包含 -march, -mabi）
      # ============================================================
      - name: Run configure
        run: |
          cd simple-riscv-software-env
          chmod +x ./configure
          export PATH="$HOME/.local/bin:$PATH"
          export PATH="$HOME/xpack/bin:$PATH"
          ./configure releasedbg rv32im_zicond_zicsr_zifencei

      - name: First build
        run: |
          cd simple-riscv-software-env
          export PATH="$HOME/.local/bin:$PATH"
          export PATH="$HOME/xpack/bin:$PATH"
          xmake build -vDr project.kintex7-bootloader 2>&1 | tee first_build.log
      # ============================================================
      # 7. 第二次构建带 -r（flags 应缺失）
      # ============================================================
      - name: Second build with -r
        run: |
          cd simple-riscv-software-env
          export PATH="$HOME/.local/bin:$PATH"
          export PATH="$HOME/xpack/bin:$PATH"
          xmake build -vDr project.kintex7-bootloader 2>&1 | tee second_build.log
          echo "=== Second build output ==="
          cat second_build.log

      # ============================================================
      # 8. 验证
      # ============================================================
      - name: Verify flags missing in second build
        run: |
          cd simple-riscv-software-env
          echo "=== Checking for -march flag in build logs ==="

          if grep -q "\-march=rv32im" first_build.log; then
            echo "✅ First build contains -march flag"
          else
            echo "❌ First build does NOT contain -march flag"
            exit 1
          fi

          if grep -q "\-march=rv32im" second_build.log; then
            echo "⚠️  Second build still contains -march flag (issue not reproduced)"
            exit 1
          else
            echo "✅ Second build does NOT contain -march flag (issue reproduced)"
          fi

      # ============================================================
      # 9. 上传日志
      # ============================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: simple-riscv-software-env/*.log