name: DISTGCC #6404 (exact)

on:
  push:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    container:
      image: debian:sid
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      # ============================================================
      # 0. 创建非特权用户，配置 sudo 免密
      # ============================================================
      - name: Setup non-root user
        run: |
          apt-get update
          apt-get install -y sudo
          useradd -m -s /bin/bash -G sudo user
          echo "user ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/user
          chmod 0440 /etc/sudoers.d/user
          # 把 xmake 安装路径写进用户 profile
          echo 'export PATH="$HOME/.local/bin:$PATH"' >> /home/user/.bashrc
          echo 'export HOME=/home/user' >> /home/user/.bashrc

      # ============================================================
      # 1. 安装系统依赖（以 user 身份通过 sudo 安装到系统）
      # ============================================================
      - name: Install system dependencies
        run: |
          sudo -u user bash -lc '
            sudo apt-get update
            sudo apt-get install -y               autoconf automake autotools-dev curl python3 python3-pip gcc               libmpc-dev libmpfr-dev libgmp-dev gawk build-essential               bison flex texinfo gperf libtool patchutils bc               zlib1g-dev libexpat-dev ninja-build git               gcc-15-riscv64-linux-gnu binutils-riscv64-linux-gnu
          '

      # ============================================================
      # 2. 安装 xmake v2.9.9 到用户目录
      # ============================================================
      - name: Install xmake (v2.9.9)
        run: |
          sudo -u user bash -lc '
            curl -fsSL https://xmake.io/shget.text | bash -s -- v2.9.9
            xmake --version
          '

      # ============================================================
      # 3. Clone 测试项目
      # ============================================================
      - name: Clone test project
        run: |
          sudo -u user bash -lc '
            git clone https://github.com/Stehsaer/simple-riscv-software-env.git
            cd simple-riscv-software-env
            git checkout a3ae04298f8dfcc0f6e0a8f2681511be2bea0558
            ls -la
          '

      # ============================================================
      # 4. 修改 toolchain.lua
      # ============================================================
      - name: Modify toolchain.lua
        run: |
          sudo -u user bash -lc '
            cd simple-riscv-software-env
            git clone https://github.com/Casinius/Issue6404_ci.git
            python3 ./Issue6404_ci/replace.py
          '

      # ============================================================
      # 5. 第一次构建（应该包含 -march, -mabi）
      # ============================================================
      - name: First build
        run: |
          sudo -u user bash -lc '
            cd simple-riscv-software-env
            chmod +x ./configure
            ./configure releasedbg rv32im_zicond_zicsr_zifencei
            xmake build -vDr project.kintex7-bootloader 2>&1 | tee first_build.log
            echo "=== First build output ==="
            cat first_build.log
          '

      # ============================================================
      # 6. 第二次构建带 -r（标志应该缺失）
      # ============================================================
      - name: Second build with -r
        run: |
          sudo -u user bash -lc '
            cd simple-riscv-software-env
            xmake build -vDr project.kintex7-bootloader 2>&1 | tee second_build.log
            echo "=== Second build output ==="
            cat second_build.log
          '

      # ============================================================
      # 7. 验证
      # ============================================================
      - name: Verify flags missing in second build
        run: |
          sudo -u user bash -lc '
            cd simple-riscv-software-env
            echo "=== Checking for -march flag in build logs ==="
            if grep -q "\-march=rv32im" first_build.log; then
              echo "✅ First build contains -march flag"
            else
              echo "❌ First build does NOT contain -march flag"
              exit 1
            fi

            if grep -q "\-march=rv32im" second_build.log; then
              echo "⚠️  Second build still contains -march flag (issue not reproduced)"
              exit 1
            else
              echo "✅ Second build does NOT contain -march flag (issue reproduced)"
            fi
          '

      # ============================================================
      # 8. 上传日志
      # ============================================================
      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /home/user/simple-riscv-software-env/*.log
