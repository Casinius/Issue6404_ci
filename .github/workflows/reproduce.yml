name: Reproduce xmake issue #6404 (exact)

on:
  push:
    paths:
      - '.github/workflows/reproduce.yml'  # 或者 .yml/.yaml 后缀
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autotools-dev curl python3 python3-pip \
            libmpc-dev libmpfr-dev libgmp-dev gawk build-essential \
            bison flex texinfo gperf libtool patchutils bc \
            zlib1g-dev libexpat-dev ninja-build git

      - name: Install xmake (specific version v2.9.9)
        
        run: |
          # 使用官方安装脚本，指定版本
          curl -fsSL https://xmake.io/shget.text | bash -s -- v2.9.9
          # 将 xmake 添加到 PATH（安装脚本默认会添加到 ~/.local/bin）
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # 验证版本
          xmake --version

      - name: Clone and build RISC-V toolchain (gcc-15)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 300
          max_attempts: 300
          retry_wait_seconds: 10
          command: |
            rm -rf riscv-gnu-toolchain
            git clone https://github.com/riscv-collab/riscv-gnu-toolchain.git
            cd riscv-gnu-toolchain
            git submodule update --init --recursive
            cd gcc
            git checkout releases/gcc-15
            cd ..
      
      

      - name: Build the toolchain
        run: |
          cd riscv-gnu-toolchain
          # 配置 multilib
          archs=(rv32im_zicond_zifencei-ilp32-- rv32im_zicond_zicsr_zifencei-ilp32-- rv32ima_zicond_zicsr_zifencei-ilp32--)
          archs_string=$(IFS=';'; echo "${archs[*]}")
          ./configure --with-multilib-generator="$archs_string" --enable-debug-info
          sudo make -j$(nproc)
          sudo make install

      - name: Clone test project (specific commit)
        run: |
          git clone https://github.com/Stehsaer/simple-riscv-software-env.git
          cd simple-riscv-software-env
          git checkout a3ae04298f8dfcc0f6e0a8f2681511be2bea0558
          ls -la   # 确认文件存在

      - name: Show full toolchain.lua before modify
        run: cat simple-riscv-software-env/toolchain.lua

      - name: Modify toolchain.lua (swap code blocks to trigger the bug)
        run: |
          cd simple-riscv-software-env
          git clone https://github.com/Casinius/Issue6404_ci.git
          python3 ./Issue6404_ci/replace.py

      - name: Show full toolchain.lua
        run: cat simple-riscv-software-env/toolchain.lua


      - name: List compiler multilib directories
        run: |
          # 假设 riscv64-unknown-elf-gcc 在 PATH 中
          gcc_path=$(which riscv64-unknown-elf-gcc)
          compiler_dir=$(dirname $gcc_path)/..
          version=$(riscv64-unknown-elf-gcc --version | head -1 | sed -E 's/.*\) ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "=== Compiler dir: $compiler_dir"
          echo "=== GCC version: $version"
          echo "=== Contents of $compiler_dir/lib/gcc/riscv64-unknown-elf/$version/"
          ls -la $compiler_dir/lib/gcc/riscv64-unknown-elf/$version/
          echo "=== Contents of $compiler_dir/riscv64-unknown-elf/lib/"
          ls -la $compiler_dir/riscv64-unknown-elf/lib/
      - name: Verify toolchain
        run: |
          echo "=== RISC-V GCC version ==="
          riscv64-unknown-elf-gcc --version || echo "riscv64-unknown-elf-gcc not found!"

          echo "=== Environment PATH ==="
          echo $PATH

      - name: Configure build
        run: |
          cd simple-riscv-software-env
          sudo chmod +x ./configure
          cat ./configure
          export XMAKE_LOGFILE="rv_conf_build.log"
          export XMAKE_COLORTERM="nocolor"
          ./configure releasedbg rv32im_zicond_zicsr_zifencei
          cat rv_conf_build.log


      - name: First build (should include -march, -mabi flags)
        run: |
          cd simple-riscv-software-env
          export XMAKE_LOGFILE="f_build.log"
          export XMAKE_COLORTERM="nocolor"
          xmake build -vDr project.kintex7-bootloader -v --diagnosis > flog.log 2>&1 || true
          cat flog.log
          cat f_build.log

      - name: Second build with -r (flags should be missing)
        run: |
          cd simple-riscv-software-env
          export XMAKE_LOGFILE="s_build.log"
          export XMAKE_COLORTERM="nocolor"
          xmake build -vDr project.kintex7-bootloader -v --diagnosis > slog.log 2>&1 || true
          cat slog.log
          cat s_build.log

      - name: Verify flags missing in second build
        run: |
          cd simple-riscv-software-env
          echo "=== Checking for -march flag in build logs ==="
          if grep -q "\-march=rv32im" first_build.log; then
            echo "✅ First build contains -march flag"
          else
            echo "❌ First build does NOT contain -march flag (check may fail)"
          fi

          if grep -q "\-march=rv32im" second_build.log; then
            echo "⚠️  Second build still contains -march flag (issue not reproduced)"
            exit 1
          else
            echo "✅ Second build does NOT contain -march flag (issue reproduced)"
          fi